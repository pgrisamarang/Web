    <!-- PWA Dynamic Manifest Injection & Install Prompt Handler -->
    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Tampilkan tombol instal jika ada elemen terkait
            const installBtn = document.getElementById('pwa-install-btn');
            if(installBtn) installBtn.classList.remove('hidden');
        });

        // Buat data manifest langsung dalam bentuk blob agar valid dan tidak butuh file eksternal
        const manifestData = {
            "name": "Smart Teacher Competition CBT",
            "short_name": "STC CBT",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#10b981",
            "icons": [
                {
                    "src": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Logo_PGRI.svg/192px-Logo_PGRI.svg.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Logo_PGRI.svg/512px-Logo_PGRI.svg.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const linkTag = document.createElement('link');
        linkTag.rel = 'manifest';
        linkTag.href = manifestURL;
        document.head.appendChild(linkTag);

        // Register Service Worker untuk dukungan offline & PWA cache
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => {
                        e.waitUntil(
                            caches.open('stc-cbt-v1').then((cache) => {
                                return cache.addAll(['./']);
                            })
                        );
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((response) => {
                                return response || fetch(e.request);
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swCode], {type: 'text/javascript'});
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('PWA Service Worker terdaftar dengan sukses!'))
                    .catch((err) => console.log('Gagal mendaftarkan SW:', err));
            });
        }
    </script>

                </div>`;
            document.body.appendChild(div);
            document.getElementById('btn-r-no').onclick = () => div.remove();
            document.getElementById('btn-r-yes').onclick = () => {
                const val = document.getElementById('inp-reset').value.trim().toUpperCase();
                div.remove();
                if(val === 'RESET') {
                    executeResetDatabase();
                } else {
                    customAlert('Gagal', 'Kata kunci salah. Reset dibatalkan.', 'error');
                }
            };
        }

        function executeResetDatabase() {
            showLoading("Mereset Data Server...");
            db.collection("peserta_stc").get().then((snapshot) => {
                const batch = db.batch();
                snapshot.docs.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                return batch.commit();
            }).then(() => {
                hideLoading();
                customAlert("Berhasil", "Seluruh data perlombaan telah direset menjadi nol.", "info");
                fetchParticipants();
            }).catch((e) => {
                hideLoading();
                customAlert("Error", "Gagal mereset data: " + e.message, "error");
            });
        }

        // --- FIREBASE: SIMPAN DAN AMBIL DATA ---
        function saveParticipantResult(res) {
            // Sistem Timeout 5 Detik Anti-Nganggur
            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => reject(new Error("TimeoutKoneksi")), 5000);
            });

            return Promise.race([
                db.collection("peserta_stc").doc(res.npa).set(res),
                timeoutPromise
            ])
            .then(() => {
                console.log("Data berhasil dikirim ke Cloud Firebase!");
            })
            .catch((error) => {
                console.error("Error menyimpan data: ", error);
                customAlert("Koneksi Lemah", "Nilai Anda tetap aman tersimpan, namun saat ini gagal dikirim ke pusat karena jaringan. Silakan screenshot halaman hasil ujian Anda.", "warning");
            });
        }

        async function fetchParticipants() {
            try {
                // Sistem Timeout 5 Detik Anti-Nganggur
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error("TimeoutKoneksi")), 5000);
                });

                const snapshot = await Promise.race([
                    db.collection("peserta_stc").get(),
                    timeoutPromise
                ]);
                
                let list = [];
                snapshot.forEach(doc => {
                    list.push(doc.data());
                });
                
                list.sort((a, b) => {
                    if (b.nilaiAkhir !== a.nilaiAkhir) return b.nilaiAkhir - a.nilaiAkhir;
                    return a.durasi - b.durasi;
                });
                state.liveScores = list;
            } catch (error) {
                console.error("Gagal mengambil Live Score:", error);
                throw error; // Lemparkan error agar ditangkap oleh panitia_login
            }
        }

        // --- ANTI CHEAT SYSTEM ---
        function handleVisibilityChange() {
            if (document.hidden && state.view === 'ujian') {
                state.violations += 1;
                saveLocalState();
                customAlert("Peringatan Pelanggaran!", `Anda telah keluar dari layar ujian! Ini adalah pelanggaran ke-${state.violations}. Poin Anda akan dikurangi 1% di akhir.`, "warning");
            }
        }
        function initAntiCheat() {
            document.removeEventListener("visibilitychange", handleVisibilityChange);
            document.addEventListener("visibilitychange", handleVisibilityChange);
        }

        // --- TIMER ---
        function startTimer() {
            clearInterval(state.intervalId);
            state.intervalId = setInterval(() => {
                state.timer--;
                saveLocalState();
                
                const m = Math.floor(state.timer / 60).toString().padStart(2, '0');
                const s = (state.timer % 60).toString().padStart(2, '0');
                const tEl = document.getElementById('timer-display');
                if(tEl) {
                    tEl.innerText = `${m}:${s}`;
                    if(state.timer <= 300) tEl.classList.add('text-red-500', 'animate-pulse');
                }
                
                if (state.timer <= 0) {
                    clearInterval(state.intervalId);
                    customAlert("Waktu Habis", "Waktu Anda telah habis. Jawaban akan dikirim otomatis.", "warning", () => {
                        finishExam();
                    });
                }
            }, 1000);
        }

        function switchView(v) {
            state.view = v;
            if(v === 'home') clearLocalState();
            saveLocalState();
            render();
        }

        function showLoading(msg = 'Menyimpan data ujian Anda ke server...') {
            const div = document.createElement('div');
            div.id = 'loading-overlay';
            div.className = 'fixed inset-0 bg-slate-900/90 z-[200] flex flex-col items-center justify-center p-4 backdrop-blur-sm';
            div.innerHTML = `
                <div class="text-5xl text-emerald-500 mb-6 animate-spin"><i class="fa-solid fa-circle-notch"></i></div>

                <p class="text-slate-400 text-sm text-center">Mohon jangan tutup halaman ini.</p>`;
            document.body.appendChild(div);
        }

        function hideLoading() {
            const el = document.getElementById('loading-overlay');
            if(el) el.remove();
        }

        // --- FUNGSI UJIAN ---
        function startExam() {
            const nama = document.getElementById('inp_nama').value.trim();
            const asal = document.getElementById('inp_asal').value.trim();
            const npa = document.getElementById('inp_npa').value.trim();

            if(!nama || !asal || !npa) {
                customAlert('Data Belum Lengkap', 'Mohon lengkapi seluruh form data diri Anda terlebih dahulu!', 'warning');
                return;
            }

            clearLocalState();

            state.pesertaNama = nama;
            state.pesertaAsal = asal;
            state.pesertaNPA = npa;
            state.startTime = Date.now();
            state.answers = {};
            state.violations = 0;
            state.timer = 90 * 60;
            state.currentQ = 0;
            
            let shuffled = [...bankSoal].sort(() => 0.5 - Math.random());
            state.shuffledQuestions = shuffled;
            
            switchView('ujian');
            startTimer();
            initAntiCheat();
        }

        function setAnswer(qIndex, aIndex) {
            state.answers[qIndex] = aIndex;
            saveLocalState();
            render();
        }

        function confirmFinish() {
            const answeredCount = Object.keys(state.answers).length;
            const unans = state.shuffledQuestions.length - answeredCount;
            if(unans > 0) {
                customConfirm("Konfirmasi Akhiri Ujian", `Masih ada <b class="text-red-500">${unans} soal</b> yang belum dijawab. Apakah yakin ingin mengakhiri ujian?`, () => {
                    finishExam();
                });
            } else {
                customConfirm("Kirim Jawaban", "Apakah Anda yakin ingin mengirimkan jawaban ujian ini?", () => {
                    finishExam();
                });
            }
        }

        function finishExam() {
            clearInterval(state.intervalId);
            document.removeEventListener("visibilitychange", handleVisibilityChange);
            
            showLoading("Memproses Nilai & Menyimpan ke Cloud...");

            const durationSecs = Math.floor((Date.now() - state.startTime) / 1000);

            let correct = 0;
            state.shuffledQuestions.forEach((q, idx) => {
                if(state.answers[idx] === q.answer) correct++;
            });

            let baseScore = (correct / state.shuffledQuestions.length) * 100;
            let finalScore = baseScore - (state.violations * 1);
            if (finalScore < 0) finalScore = 0;

            const resultData = {
                nama: state.pesertaNama,
                asal: state.pesertaAsal,
                npa: state.pesertaNPA,
                benar: correct,
                totalSoal: state.shuffledQuestions.length,
                pelanggaran: state.violations,
                durasi: durationSecs,
                nilaiAkhir: parseFloat(finalScore.toFixed(2)),
                waktuSelesai: new Date().toISOString()
            };

            saveParticipantResult(resultData).then(() => {
                hideLoading();
                switchView('result');
            });
        }

                        <h2 class="bg-emerald-500 text-emerald-950 px-4 py-1 rounded-full font-bold text-xs inline-block mb-4">UJIAN SELESAI BERHASIL</h2>
                        <h1 class="text-3xl font-extrabold mb-1">${state.pesertaNama}</h1>
                        <p class="text-slate-400 text-sm mb-8">${state.pesertaAsal} • NPA: ${state.pesertaNPA}</p>
                        
                        <div class="bg-slate-800 rounded-2xl p-6 mb-8 text-left border border-slate-700">
                            <div class="flex justify-between items-center mb-4 border-b border-slate-700/50 pb-4">
                                <span class="text-slate-400">Jawaban Benar:</span>
                                <span class="font-bold text-emerald-400">${correct} / ${state.shuffledQuestions.length}</span>
                            </div>
                            <div class="flex justify-between items-center mb-4 border-b border-slate-700/50 pb-4">
                                <span class="text-slate-400">Total Pelanggaran:</span>
                                <span class="font-bold ${state.violations > 0 ? 'text-red-400' : 'text-slate-400'}">${state.violations} Kali (-${state.violations}%)</span>
                            </div>
                            <div class="flex justify-between items-center mb-6">
                                <span class="text-slate-400">Durasi Pengerjaan:</span>
                                <span class="font-bold text-white">${mins} Menit</span>
                            </div>
                            <div class="flex justify-between items-end pt-4 border-t border-slate-700">
                                <span class="text-slate-400 font-bold">Nilai Akhir:</span>
                                <span class="font-black text-5xl text-amber-400 drop-shadow-md">${parseFloat(finalScore.toFixed(2))}</span>
                            </div>
                        </div>
                        
                        <button onclick="switchView('home')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-4 rounded-xl transition">Kembali ke Beranda Utama</button>
                    </div>
                </div>`;
            }
        }

        window.onload = function() {
            const savedState = localStorage.getItem('stc_cbt_state');
            if(savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    Object.assign(state, parsed);
                } catch(e) {
                    console.error("Gagal memulihkan sesi", e);
                }
            }

            render();

            if(state.view === 'ujian') {
                startTimer();
                initAntiCheat();
            } else if (state.view === 'panitia_dash') {
                fetchParticipants().then(() => render());
            }
        };
    </script>
</body>
</html>
